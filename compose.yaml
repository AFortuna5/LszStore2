services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lszstore
    ports:
      - "5432:5432"
    volumes:
      - lszstore_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lszstore"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lszstore_postgres:
